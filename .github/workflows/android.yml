name: Build BetaMusic APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Download repository
        uses: actions/checkout@v4

      - name: Install Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Configure Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Configure Android SDK
        uses: android-actions/setup-android@v4

      - name: Install Android components
        run: sdkmanager "platforms;android-35" "build-tools;35.0.0" "platform-tools"

      - name: Extract Android project
        run: |
          mkdir native
          unzip -q BetaMusic-Native-Android.zip -d native
          ls -la native

      - name: Compile APK
        run: gradle --no-daemon --stacktrace -p native assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: BetaMusic-Native-APK
          path: native/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 14
